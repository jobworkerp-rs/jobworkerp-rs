syntax = "proto3";
package jobworkerp.runner.llm;

message TokenCountResult {
  enum TokenCountErrorCode {
    TOKEN_COUNT_ERROR_CODE_UNSPECIFIED = 0;
    INVALID_TOKEN_COUNT_ARGUMENT = 1;
    TOKEN_COUNT_EXACT_UNAVAILABLE = 2;
    PROVIDER_CAPABILITY_UNAVAILABLE = 3;
  }

  message TextSuccess {
    string resolved_model = 1;
    optional string tokenizer_id = 2;
    repeated uint64 counts = 3;
    uint64 total_tokens = 4;
  }

  // Exact count for a rendered completion or chat provider request.
  message RenderedRequestSuccess {
    string resolved_model = 1;
    optional string tokenizer_id = 2;
    optional uint64 context_window_tokens = 3;
    optional uint64 max_completion_tokens = 4;
    uint64 rendered_input_tokens = 5;
  }

  message Error {
    TokenCountErrorCode code = 1;
    optional string detail = 2;
  }

  oneof outcome {
    TextSuccess text_success = 1;
    RenderedRequestSuccess rendered_request_success = 2;
    Error error = 3;
  }
}
