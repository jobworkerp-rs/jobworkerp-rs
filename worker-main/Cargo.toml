[package]
name = "jobworkerp-main"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "all-in-one"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"


[dependencies]
proto = { path = "../proto" }
command-utils = { path = "../modules/command-utils" }
infra-utils = { path = "../modules/infra-utils" }
jobworkerp-runner = { path = "../runner" }
jobworkerp-base = { path = "../base" }
infra = { path = "../infra" }
app = { path = "../app" }
app-wrapper = { path = "../app-wrapper" }
worker-app = { path = "../worker-app" }
grpc-front = { path = "../grpc-front" }
mcp-server = { path = "../mcp-server" }
ag-ui-front = { path = "../ag-ui-front" }

anyhow = { workspace = true }
dotenvy = { workspace = true }
envy = { workspace = true }
hostname = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Same release as the microsandbox SDK linked through jobworkerp-runner; the
# tests compare its runtime constants with docker/sandbox/Dockerfile.
microsandbox-utils = "0.7"
serde_json = { workspace = true }
toml = { workspace = true }
jobworkerp-base = { path = "../base", features = ["test-utils"] }
