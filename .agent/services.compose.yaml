# Test services for coding agents run by the issue-auto-resolve workflow.
# The workflow starts them as a separate compose project per run and joins the
# agent and verification containers to the project network, so ports are not
# published and data is never shared between runs.
services:
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
  # Needed for `--features mysql` tests; some failures (e.g. pool leaks) only
  # show up on MySQL. Credentials mirror the CI service.
  db:
    image: mysql:8.4
    command: ["--mysql-native-password=ON"]
    environment:
      MYSQL_DATABASE: test
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysqlpw
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # TCP ping only succeeds once the entrypoint's socket-only init server is
      # replaced by the real one.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 90
