name: Release

# Maintained in the private source repository and published here by its
# release sync together with the rest of .github/; edit it there, not here.
# The release sync pushes a vMAJOR.MINOR.PATCH tag, which builds the jobworkerp
# binaries for every supported platform and attaches the archives, SHA256SUMS
# and build provenance attestations to the GitHub Release for the tag. Tests
# run in the private CI before a release is tagged; this workflow only builds,
# so that the build of every published artifact is publicly visible.
#
# Only a tag push (which needs write access) may start this workflow, the
# build jobs get a read-only token and run on GitHub-hosted runners only, and
# every job is limited to GitHub so that the private source, which tracks this
# file, never runs it. The private source checks these rules on every change
# (scripts/test-public-release-workflow.py).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A re-pushed tag re-runs this; let a fresh run supersede an in-flight one
# without cancelling (avoid a half-uploaded release).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# `shell: bash` makes every step run as `bash -e -o pipefail`.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  # Every binary shipped in each archive.
  BINARIES: all-in-one worker grpc-front mcp-http mcp-stdio ag-ui-http ag-ui-http-async

jobs:
  # The license listing of every crate linked into the binaries, shipped in
  # each archive. It fails on a license about.toml does not accept.
  licenses:
    name: Third-party licenses
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout crate submodules
        run: bash scripts/init-crate-submodules.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Generate license listing
        run: |
          mkdir -p dist
          bash scripts/generate-license-listing.sh dist/THIRD-PARTY-LICENSES.txt

      - name: Upload license listing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: dist/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    if: github.server_url == 'https://github.com'
    needs: licenses
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries link glibc dynamically: the PLUGIN runner loads
          # plugins with dlopen, which a static (musl) binary cannot. Building
          # on Ubuntu 24.04 sets the floor to glibc 2.39, which
          # verify-server-artifact.sh enforces and README.md documents. Each
          # is built natively on its architecture so the artifact check can
          # run it.
          - name: linux-x86_64
            runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # 11.0 is the oldest macOS Rust supports on Apple Silicon.
          - name: darwin-arm64
            runs_on: macos-15
            target: aarch64-apple-darwin
            extra_env: MACOSX_DEPLOYMENT_TARGET=11.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout crate submodules
        run: bash scripts/init-crate-submodules.sh

      - name: Export platform settings
        env:
          EXTRA_ENV: ${{ matrix.extra_env }}
        run: |
          for kv in ${EXTRA_ENV}; do
            echo "${kv}" >>"${GITHUB_ENV}"
          done

      # .cargo/config.toml links Linux builds with mold.
      - name: Install mold
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold

      - name: Install protoc
        run: bash scripts/install-protoc.sh "${RUNNER_TEMP}/protoc"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No Rust cache: GitHub scopes caches to the ref, and a tag-only
      # workflow can never restore what a previous tag saved.
      - name: Show build environment
        env:
          EXTRA_ENV: ${{ matrix.extra_env }}
        run: |
          uname -a
          if [ "$(uname -s)" = Darwin ]; then
            sw_vers
            xcrun --show-sdk-version || true
          else
            grep -E '^(NAME|VERSION)=' /etc/os-release
            # sed reads all input: `head` could SIGPIPE the writer under pipefail.
            ldd --version | sed -n 1p
          fi
          rustc --version --verbose
          "${PROTOC}" --version
          echo "platform settings: ${EXTRA_ENV}"

      # The packages of every binary in BINARIES.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked --target "${TARGET}" \
            -p jobworkerp-main -p grpc-front -p mcp-server -p ag-ui-front --bins

      - name: Download license listing
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses

      # COPYFILE_DISABLE keeps macOS tar from adding AppleDouble (._*) files.
      - name: Verify and package
        env:
          TARGET: ${{ matrix.target }}
          # The matrix name is the platform verify-server-artifact.sh checks.
          PLATFORM: ${{ matrix.name }}
          COPYFILE_DISABLE: '1'
        run: |
          stage="jobworkerp-${TARGET}"
          mkdir -p "dist/${stage}"
          for binary in ${BINARIES}; do
            built="target/${TARGET}/release/${binary}"
            bash scripts/verify-server-artifact.sh "${built}" "${PLATFORM}" "${GITHUB_REF_NAME#v}"
            cp "${built}" "dist/${stage}/"
          done
          cp LICENSE-MIT LICENSE-APACHE licenses/THIRD-PARTY-LICENSES.txt README.md README_ja.md dot.env "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          rm -rf "dist/${stage:?}"
          ls -l dist

      # Stored uncompressed: the archive is already gzip-compressed.
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  # Holds the release write token and signs the provenance of what the build
  # jobs produced.
  publish:
    name: Publish GitHub Release
    if: github.server_url == 'https://github.com'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The build matrix names (linux-x86_64, ...), not the license listing.
          pattern: '*-*64'
          path: dist
          merge-multiple: true

      # The sync commit body lists the changes since the previous public
      # release and ends with an "Upstream-Tag: <tag>" trailer. A tag on an
      # older sync commit means the release had no public source changes.
      - name: Write checksums and release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ls -l dist
          (cd dist && sha256sum -- *.tar.gz >SHA256SUMS && cat SHA256SUMS)
          message=$(git log -1 --format=%B HEAD)
          if printf '%s\n' "${message}" | grep -Fqx "Upstream-Tag: ${TAG_NAME}"; then
            printf '%s\n' "${message}" | awk 'NR > 2 && !/^Upstream-Tag: /' >release-notes.md
          else
            echo "No source changes since the previous release." >release-notes.md
          fi
          cat release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
